name: Check UCLA classes

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub sometimes runs it a bit late)
  workflow_dispatch:         # lets you press "Run workflow" by hand
    inputs:
      test_notification:
        description: "Just send a test notification to my phone"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save state.json

concurrency:
  group: class-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: ${{ inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_classes.py --test

      - name: Check classes
        if: ${{ !inputs.test_notification }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_classes.py

      - name: Save status
        if: ${{ !inputs.test_notification }}
        run: |
          git config user.name "class-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update class status"
            git pull --rebase --quiet
            git push
          fi
